<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b101a"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Repeaters list 705</title><link rel="stylesheet" href="style.css"></head><body>
<div class="shell">
<header><div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 15v20m-9 0h18M11 8Q3 16 11 24m18-16q8 8 0 16M6 3q-12 13 0 26m28-26q12 13 0 26"/><circle cx="20" cy="13" r="4"/></svg></div><div class="brand"><span>REPEATERS LIST <b>705</b></span><small>Sua próxima conexão começa aqui.</small></div><button class="iconbtn" id="settingsButton" aria-label="Configurações">⚙</button></header>
<main>
<div class="eyebrow">DIRETÓRIO DE REPETIDORAS <span class="online-dot"></span> OFFLINE</div>
<div class="titleline"><h1>Explore as<br><em>frequências.</em></h1><button id="addButton" class="roundadd" aria-label="Adicionar repetidora"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
<div class="stats" id="stats"></div>
<div class="searchbar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="query" type="search" placeholder="Cidade, indicativo, frequência..." aria-label="Pesquisar repetidoras"><button id="filterButton" aria-label="Pesquisa avançada"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18M8 3v6m8 0v6m-6 0v6"/></svg><span id="filterCount"></span></button></div>
<div class="quick" id="quick"><button data-mode="" class="selected">Todas</button><button data-mode="FM">FM analógico</button><button data-mode="DV">D-STAR</button><button id="favoritesButton">☆ Favoritas</button></div>
<div class="resulthead"><span id="count" role="status"></span><select id="sort" aria-label="Ordenar resultados"><option value="name">Cidade A–Z</option><option value="frequency">Frequência</option><option value="call">Indicativo</option><option value="distance">Mais próximas</option></select></div>
<div id="originInfo" class="origin" hidden></div><div id="list"></div><button id="moreButton" class="secondary more" hidden>Carregar mais</button>
<div class="baseinfo" id="baseInfo"></div>
</main>
<nav aria-label="Ações da base"><button id="listButton" class="active"><span>▦</span>Lista</button><button id="importButton"><span>↓</span>Importar</button><button id="exportButton"><span>↑</span>Exportar</button><button id="syncButton"><span>⟳</span>Atualizar</button></nav>
</div>
<dialog id="modal"><div class="modalhead"><div><small id="modalTag"></small><h2 id="modalTitle"></h2></div><button class="iconbtn" id="closeModal" aria-label="Fechar">✕</button></div><div id="modalBody"></div></dialog>
<div id="toast" role="status" hidden></div><div id="busy" role="status" hidden><div class="spinner"></div><p id="busyText">Aguarde…</p></div>
<script src="cities.js"></script><script src="core.js"></script><script src="app.js"></script></body></html>
