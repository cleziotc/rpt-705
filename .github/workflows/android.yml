name: Android validation and release
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  RPT_VERSION: '1.1.0'
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: CSV and merge regression tests
        run: |
          mkdir -p /tmp/rpt-tests
          javac -d /tmp/rpt-tests app/src/main/java/br/com/pp5ci/repeaters705/Csv.java tests/CsvTest.java
          java -cp /tmp/rpt-tests CsvTest data/rpt_updated.csv
          node tests/core.test.cjs data/rpt_updated.csv
          node --check app/src/main/assets/app.js
          cmp data/rpt_updated.csv app/src/main/assets/rpt_updated.csv
      - name: Compile Android app and instrumentation
        run: gradle assembleDebug assembleDebugAndroidTest lintDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            sleep 15
            adb shell input keyevent 82
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w br.com.pp5ci.repeaters705.test/br.com.pp5ci.repeaters705.SmokeTest | tee native-smoke.log
            adb logcat -d > native-logcat.txt
            grep -E 'chromium|AndroidRuntime|pp5ci|FATAL|WebView|SmokeTest' native-logcat.txt || true
            grep 'PASS: Native WebView' native-smoke.log
            adb uninstall br.com.pp5ci.repeaters705
            adb install dist/Repeaters-list-705-v${RPT_VERSION}.apk
            adb shell am force-stop com.android.launcher3
            adb shell am start -W -n br.com.pp5ci.repeaters705/.MainActivity
            for attempt in $(seq 1 8); do adb shell uiautomator dump /sdcard/release-window.xml; adb pull /sdcard/release-window.xml release-window.xml; grep -q '589' release-window.xml && break; adb shell am force-stop com.android.launcher3; sleep 3; done
            grep -q '589' release-window.xml
      - name: Verify signed release APK
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Repeaters-list-705-v${RPT_VERSION}.apk
          test "$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs Repeaters-list-705-v1.0.0.apk | grep 'Signer #1 certificate SHA-256 digest')" = "$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs Repeaters-list-705-v${RPT_VERSION}.apk | grep 'Signer #1 certificate SHA-256 digest')"
          python3 ../tools/verify_apk.py Repeaters-list-705-v${RPT_VERSION}.apk ..
      - name: Store build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation
          path: |
            native-smoke.log
            native-logcat.txt
            release-window.xml
            app/build/reports/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$RPT_VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; preserving its signed assets.'
          else
            gh release create "v$RPT_VERSION" dist/Repeaters-list-705-v${RPT_VERSION}.apk dist/SHA256SUMS --target "$GITHUB_SHA" --title "Repeaters list 705 v$RPT_VERSION" --notes-file RELEASE_NOTES.md
          fi
